<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Opportunity intelligence workflow</title>
<desc id="d">Public evidence is normalized, deduplicated, gated, scored, turned into a proof plan, and reviewed by a human.</desc>
<rect width="1200" height="320" fill="#0b1020"/>
<text x="56" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">A lead is not a client. First prove it deserves attention.</text>
<path d="M86 173 H1110" stroke="#273449" stroke-width="5" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g transform="translate(105)"><circle cy="173" r="27" fill="#60a5fa"/><text y="180" font-size="18" font-weight="700">1</text><text y="222" fill="#dbeafe" font-size="14">normalize</text></g>
  <g transform="translate(285)"><circle cy="173" r="27" fill="#38bdf8"/><text y="180" font-size="18" font-weight="700">2</text><text y="222" fill="#dbeafe" font-size="14">dedupe</text></g>
  <g transform="translate(465)"><circle cy="173" r="27" fill="#fb7185"/><text y="180" font-size="18" font-weight="700">3</text><text y="222" fill="#ffe4e6" font-size="14">hard gate</text></g>
  <g transform="translate(645)"><circle cy="173" r="27" fill="#22d3ee"/><text y="180" font-size="18" font-weight="700">4</text><text y="222" fill="#cffafe" font-size="14">score evidence</text></g>
  <g transform="translate(825)"><circle cy="173" r="27" fill="#a78bfa"/><text y="180" font-size="18" font-weight="700">5</text><text y="222" fill="#ede9fe" font-size="14">proof plan</text></g>
  <g transform="translate(1005)"><circle cy="173" r="27" fill="#4ade80"/><text y="180" font-size="18" font-weight="700">6</text><text y="222" fill="#dcfce7" font-size="14">human review</text></g>
</g>
<text x="465" y="120" fill="#fb7185" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">reject ≠ low score</text>
<text x="1140" y="286" fill="#64748b" font-family="Arial,sans-serif" font-size="13" text-anchor="end">No “83.7% likely to buy” cosplay.</text>
</svg>