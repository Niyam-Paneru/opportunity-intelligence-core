<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Opportunity intelligence architecture</title><desc id="d">Public opportunity evidence is normalized, hard-gated, scored, turned into a proof plan, and sent to human review.</desc>
<rect width="1200" height="560" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">OPPORTUNITY INTELLIGENCE</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">Score attention, not destiny.</text>

<rect x="58" y="160" width="180" height="95" rx="14" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="80" y="191" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">PUBLIC EVIDENCE</text>
<text x="80" y="223" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">opportunity</text>

<rect x="300" y="135" width="210" height="145" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="325" y="168" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">CLEANUP</text>
<text x="325" y="200" fill="#171714" font-family="Georgia,serif" font-size="23">Normalize + dedupe</text>
<text x="325" y="238" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">same source?</text>
<text x="325" y="262" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">same problem?</text>

<rect x="580" y="135" width="210" height="145" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="605" y="168" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">HARD GATES</text>
<text x="605" y="200" fill="#171714" font-family="Georgia,serif" font-size="23">Eligible at all?</text>
<text x="605" y="238" fill="#a4243b" font-family="Arial,sans-serif" font-size="14">expired / unsafe / blocked</text>

<rect x="860" y="135" width="275" height="145" rx="16" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
<text x="885" y="168" fill="#596e35" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">TRIAGE</text>
<text x="885" y="200" fill="#171714" font-family="Georgia,serif" font-size="23">Score → proof plan</text>
<text x="885" y="238" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">evidence strength</text>
<text x="1000" y="238" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">proofability</text>
<text x="885" y="262" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">human review last</text>

<g stroke="#171714" stroke-width="2" fill="none"><path d="M238 207 H300"/><path d="M510 207 H580"/><path d="M790 207 H860"/></g>
<g fill="#171714"><path d="M292 201 l10 6 -10 6z"/><path d="M572 201 l10 6 -10 6z"/><path d="M852 201 l10 6 -10 6z"/></g>

<rect x="580" y="350" width="555" height="90" rx="14" fill="#f1d9dc" stroke="#a4243b" stroke-width="2"/>
<text x="605" y="382" fill="#a4243b" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">IMPORTANT</text>
<text x="605" y="412" fill="#171714" font-family="Georgia,serif" font-size="20">A high score means “look here first.” It is not a sales probability.</text>
</svg>