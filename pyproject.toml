[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-intelligence-core"
version = "0.1.0"
description = "Deterministic opportunity triage with hard gates, deduplication, evidence scoring, and human review."
readme = "README.md"
authors = [{ name = "Niyam Paneru" }]
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lead-research","scoring","deduplication","human-review","automation"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/Niyam-Paneru/opportunity-intelligence-core"
Source = "https://github.com/Niyam-Paneru/opportunity-intelligence-core"
