[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-intelligence-core"
version = "0.1.0"
description = "Deterministic opportunity triage with hard gates, deduplication, evidence scoring, and human review."
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lead-research","scoring","deduplication","human-review","automation"]

[tool.setuptools.packages.find]
where = ["src"]
